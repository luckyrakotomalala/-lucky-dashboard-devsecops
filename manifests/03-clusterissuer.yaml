# ClusterIssuer auto-signé — adapté à un cluster de test (kind/minikube) sans domaine public.
# Pour un vrai domaine en production, remplacer par un ClusterIssuer Let's Encrypt
# (voir la variante letsencrypt en commentaire plus bas).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---
