apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lucky-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<votre-user>/<votre-repo>.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
